services:
  api:
    build: .
    container_name: fastify-template-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: fastify-template-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: fastify-template-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
